name: Toolchain distributions
on:
  workflow_dispatch:
  push:
    tags: ['embedts-v*']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-14
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EMBEDTS_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os,tomllib; version=tomllib.load(open("rust/Cargo.toml","rb"))["workspace"]["package"]["version"]; assert os.environ["EMBEDTS_RELEASE_TAG"] == "embedts-v" + version'
      - run: cargo build -p embedts-builder --release --locked
        working-directory: rust
      - run: python3 scripts/package_toolchain.py --binary rust/target/release/embedts --out artifacts/toolchain
      - name: Compile an SDK app with the distribution
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          directory = pathlib.Path('artifacts/toolchain')
          manifest = json.loads(next(directory.glob('*.json')).read_text())
          subprocess.run([str((directory / manifest['binary']).resolve()), 'build', 'typescript/examples/hello/scripts/main.ts', '--out', 'artifacts/hello.etb'], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: embedts-${{ matrix.platform }}
          path: artifacts/toolchain/
          if-no-files-found: error
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: '24.11.1'
      - run: npm install --global pnpm@12.14.0 --ignore-scripts --no-audit --no-fund
      - run: pnpm -C typescript install --frozen-lockfile --ignore-scripts
      - run: pnpm -C typescript test
      - run: pnpm -C typescript typecheck
      - name: Package command entry and SDK
        run: |
          mkdir -p artifacts/packages
          pnpm -C typescript/packages/builder pack --pack-destination ../../../artifacts/packages
          pnpm -C typescript/packages/sdk pack --pack-destination ../../../artifacts/packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: embedts-source-packages
          path: artifacts/packages/
          if-no-files-found: error
